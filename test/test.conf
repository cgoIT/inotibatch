# test.conf – Minimal example config for testing InotiBatch

SOURCE_DIR=/data/source
TARGET_DIR=/data/dest
TARGET_OWNER="root:adm"

EVENTS=moved_to,close_write,create
RECURSIVE=true
EXCLUDE_PATTERNS=("*.tmp")
SANITIZE_FILENAMES=true

ACTION_SCRIPT=/data/actions/default-action.sh
PRE_HOOK_DIR=/data/hooks/pre-copy.d
POST_HOOK_DIR=/data/hooks/post-copy.d
POST_HOOK_BATCH_SIZE=2
POST_HOOK_IDLE_TIMEOUT=2

MAIL_ON_ERROR=admin@example.com