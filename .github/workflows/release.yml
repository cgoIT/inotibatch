name: Release, Build .deb & Publish APT repo (gh-pages)

on:
  push:
    branches:
      - main

jobs:
  # 1) release-please may create Release/Tag
  release:
    runs-on: ubuntu-latest
    outputs:
      local_run: ${{ steps.detect-local-run.outputs.local_run }}
      release_created: ${{ steps.set-outputs.outputs.release_created }}
      tag_name: ${{ steps.set-outputs.outputs.tag_name }}
      version: ${{ steps.set-outputs.outputs.version }}
    steps:
      - name: Detect local run
        id: detect-local-run
        run: |
          set -e

          if [ -n "${ACT}" ]; then
            echo "local_run=true" >> $GITHUB_OUTPUT
          else
            echo "local_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Run release-please
        if: steps.detect-local-run.outputs.local_run == 'false'
        id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: simple

      - name: Set outputs
        id: set-outputs
        env:
          ACT: ${{ env.ACT }}
        run: |
          set -eu

          if [ "${ACT}" = "true" ]; then
            VERSION=$(grep -oP '^## \[\K[0-9]+\.[0-9]+\.[0-9]+' "CHANGELOG.md" | head -n 1)
            echo "release_created=true" >> $GITHUB_OUTPUT
            echo "tag_name=v${VERSION}" >> $GITHUB_OUTPUT
            echo "version=${VERSION}" >> $GITHUB_OUTPUT

            rm -rf build/ repo/
          else
            echo "release_created=${{ steps.release.outputs.release_created }}" >> $GITHUB_OUTPUT
            echo "tag_name=${{ steps.release.outputs.tag_name }}" >> $GITHUB_OUTPUT
            echo "version=${{ steps.release.outputs.version }}" >> $GITHUB_OUTPUT
          fi

  # 2) Build & sign .deb, upload to Github Release and Github Pages (gh-pages)
  build-and-upload:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    env:
      GH_PAGES_BRANCH: gh-pages
      BUILD_DIR: build
      REPO_DIR: build/ppa
      PKG: inotibatch
      DIST: noble
      URGENCY: medium
      MAINTAINER: cgoIT <info@cgo-it.de>
      ARCH: all
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build tools
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential \
            fakeroot \
            devscripts \
            debhelper \
            dh-make \
            reprepro \
            git \
            gnupg \
            curl \
            pandoc

      - name: Prepare control & changelog files
        env:
          PKG: ${{ env.PKG }}
          DIST: ${{ env.DIST }}
          URGENCY: ${{ env.URGENCY }}
          MAINTAINER: ${{ env.MAINTAINER }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          ./build-scripts/generate-control.sh
          ./build-scripts/generate-changelog.sh

      - name: Prepare build directory
        run: |
          set -eu

          mkdir -p ${{ env.BUILD_DIR }}
          rsync -a \
            --exclude ${{ env.BUILD_DIR }}/ \
            --exclude systemd/ \
            --exclude logrotate/ \
            ./ "${{ env.BUILD_DIR }}/${{ env.PKG }}-${{ needs.release.outputs.version }}/"

          echo "Prepare systemd files"
          for systemd_file in systemd/*.service; do
            sed -i "s|/path/to/inotibatch.sh|/usr/share/inotibatch/bin/inotibatch.sh|g" "$systemd_file"
          done
          cp systemd/*.service ${{ env.BUILD_DIR }}/${{ env.PKG }}-${{ needs.release.outputs.version }}/debian/

          echo "Prepare logrotate files"
          for logrotate_file in logrotate/*; do
            filename=$(basename $logrotate_file)
            cp $logrotate_file ${{ env.BUILD_DIR }}/${{ env.PKG }}-${{ needs.release.outputs.version }}/debian/$filename.logrotate
          done

      - name: Import GPG key
        id: import-gpg-key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Build Debian package
        working-directory: ./${{ env.BUILD_DIR }}/${{ env.PKG }}-${{ needs.release.outputs.version }}
        env:
          KEY_FINGERPRINT: ${{ steps.import-gpg-key.outputs.fingerprint }}
        run: |
          set -eu

          echo "Building signed source package and binary package..."
          DEBEMAIL="info@cgo-it.de" DEBFULLNAME="cgoIT" \
          debuild -sa -us -uc -k"${{ env.KEY_FINGERPRINT }}"

          echo "Debian packages successfully built."

      - name: Checkout gh-pages for PPA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GH_PAGES_BRANCH }}
          path: ${{ env.REPO_DIR }}

      - name: Update PPA
        run: |
          set -eu

          if [ ! -f "${{ env.REPO_DIR }}/conf/distributions" ]; then
            echo "Prepare repo"
            mkdir -p ${{ env.REPO_DIR }}/conf
            mkdir -p ${{ env.REPO_DIR }}/pool

            cat > ${{ env.REPO_DIR }}/conf/distributions <<EOF
          Origin: ${{ env.PKG }}
          Label: ${{ env.PKG }}
          Suite: ${{ env.DIST }}
          Codename: ${{ env.DIST }}
          Components: main
          Architectures: amd64 source
          EOF
          fi

          reprepro -b ${{ env.REPO_DIR }} remove \
            ${{ env.DIST }} ${{ env.PKG }} ${{ needs.release.outputs.version }} || true
          reprepro -b ${{ env.REPO_DIR }} includedsc \
            ${{ env.DIST }} ${{ env.BUILD_DIR }}/${{ env.PKG }}_${{ needs.release.outputs.version }}.dsc
          reprepro -b ${{ env.REPO_DIR }} includedeb \
            ${{ env.DIST }} ${{ env.BUILD_DIR }}/${{ env.PKG }}_${{ needs.release.outputs.version }}_${{ env.ARCH }}.deb

      - name: Sign Release / InRelease && copy public key
        run: |
          echo "Copy public key"
          cp public.key ${{ env.REPO_DIR }}

          echo "Generate and sign release files"
          cd ${{ env.REPO_DIR }}

          # Generate Release file in the correct DIST folder
          apt-ftparchive release dists/${{ env.DIST }} > dists/${{ env.DIST }}/Release

          # Detached signature for apt
          gpg --batch --yes --pinentry-mode loopback -abs -o dists/${{ env.DIST }}/Release.gpg dists/${{ env.DIST }}/Release

          # InRelease (clearsign) for apt
          gpg --batch --yes --pinentry-mode loopback --clearsign -o dists/${{ env.DIST }}/InRelease dists/${{ env.DIST }}/Release

      - name: Publish apt repo to gh-pages
        if: needs.release.outputs.local_run == 'false'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./${{ env.REPO_DIR }}
          publish_branch: ${{ env.GH_PAGES_BRANCH }}

      - name: Upload DEB to Github Release
        if: needs.release.outputs.local_run == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag_name }}
          files: |
            ${{ env.BUILD_DIR }}/${{ env.PKG }}_${{ needs.release.outputs.version }}_${{ env.ARCH }}.deb
            ${{ env.BUILD_DIR }}/${{ env.PKG }}_${{ needs.release.outputs.version }}_${{ env.ARCH }}.dsc
            public.key

      - name: Add job summary
        run: |
          set -eu

          {
            echo "## 📦 Build & Publish Summary"
            echo ""
            echo "| Key        | Value |"
            echo "|------------|-------|"
            echo "| Version    | ${{ needs.release.outputs.version }} |"
            echo "| Tag        | ${{ needs.release.outputs.tag_name }} |"
            echo "| Local Run  | ${{ needs.release.outputs.local_run }} |"
            echo ""
            echo "### 🌐 Repository"
            echo "[APT Repo on GitHub Pages](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/)"
          } >> $GITHUB_STEP_SUMMARY
